# DEPRECATED — prefer templates/github-workflows/eval-ci.yml (select+pack one job).
# Thin caller — implementation lives in hutch-fail/evals (reusable workflow).
# Pin hub_ref to the same commit/tag as uses: @pin. GitHub ignores evals/.github/.
# Pass OP_SERVICE_ACCOUNT_TOKEN for 1Password → App credentials → private hub checkout.
name: eval pack

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: eval-pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-pack:
    # Skip Dependabot: bumps are not behavior PRs and lack eval packs.
    if: github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'renovate[bot]'
    # PIN: replace both @PIN and hub_ref with the same hutch-fail/evals commit or tag
    uses: hutch-fail/evals/.github/workflows/eval-pack-gate.yml@PIN
    with:
      evals_path: evals
      hub_ref: PIN
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
